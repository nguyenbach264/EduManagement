services:
  postgres:
    image: postgres:16-alpine
    container_name: edumanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edumanagement}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Bach@Edu2026}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - edumanagement_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edumanagement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 220M
    networks:
      - edumanagement-net

  redis:
    image: redis:7-alpine
    container_name: edumanagement_redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --requirepass "${REDIS_PASSWORD:-Bach@Redis2026}" --maxmemory 48mb --maxmemory-policy allkeys-lru --appendonly yes'
    ports:
      - "6380:6379"
    volumes:
      - edumanagement_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-Bach@Redis2026}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - edumanagement-net

  backend:
    image: ${DOCKERHUB_USERNAME:-nguyenbach}/edumanagement-backend:${IMAGE_TAG:-latest}
    container_name: edumanagement_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edumanagement}?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Bach@Edu2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Bach@Redis2026}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JAVA_OPTS: "-Xms160m -Xmx280m -XX:+UseG1GC -XX:+UseStringDeduplication"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - edumanagement-net
    deploy:
      resources:
        limits:
          memory: 380M

  frontend:
    image: ${DOCKERHUB_USERNAME:-nguyenbach}/edumanagement-frontend:${IMAGE_TAG:-latest}
    container_name: edumanagement_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - edumanagement-net
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  edumanagement_postgres_data:
    name: edumanagement_postgres_data
  edumanagement_redis_data:
    name: edumanagement_redis_data

networks:
  edumanagement-net:
    name: edumanagement_network
    driver: bridge