name: EduManagement CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build & Run Tests
        working-directory: backend
        run: mvn clean verify -B

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edumanagement-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edumanagement-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Azure VPS
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "apps/edumanagement"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p ~/apps/edumanagement
            cd ~/apps/edumanagement

            echo "📥 Kéo các Docker images mới nhất..."
            docker compose -f docker-compose.prod.yml pull backend frontend

            echo "🚀 Khởi động cụm EduManagement..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Dọn dẹp images cũ..."
            docker image prune -f

            echo "✅ Kiểm tra trạng thái containers:"
            docker ps --filter "name=edumanagement"

      - name: Verify Healthcheck
        run: |
          echo "Kiểm tra phản hồi của EduManagement API..."
          sleep 15
          curl -s -k -f https://edu.nguyenbach.click/health || echo "Waiting for domain DNS and certbot setup"