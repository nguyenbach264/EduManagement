spring:
  application:
    name: edumanagement-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: "${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}" # Base64 256-bit key
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}     # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  academic:
    default-min-credits: 12
    default-max-credits: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
